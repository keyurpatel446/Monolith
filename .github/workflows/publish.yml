name: Publish to PyPI

# Fires when CI tags a release (the tag job in ci.yml pushes vX.Y.Z on merge to
# master). Builds the sdist + wheel and uploads them to PyPI.
#
# Uses PyPI Trusted Publishing (OIDC) — no long-lived API token required.
# One-time maintainer setup is documented in docs/PUBLISHING.md:
#   1. Confirm/claim the project name in pyproject.toml on PyPI.
#   2. Add a Trusted Publisher on PyPI pointing at this repo + workflow +
#      the `pypi` environment below.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment: pypi  # matches the Trusted Publisher config on PyPI
    permissions:
      id-token: write  # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
