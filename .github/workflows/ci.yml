name: CI

# Tests run on every push/PR to master or develop. When code lands on master
# (i.e. a merge), the `tag` job reads the version from pyproject.toml and, if no
# matching tag exists yet, creates the tag and a GitHub release.
on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v

  tag:
    name: Tag & release on merge to master
    runs-on: ubuntu-latest
    needs: test
    # Only on a real push (merge) to master, never on PRs or develop.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write  # needed to push the tag and create the release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so we can see existing tags
      - name: Read version from pyproject.toml
        id: ver
        run: |
          VERSION=$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"
      - name: Create tag and release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --generate-notes
