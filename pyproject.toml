[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "monolith-ai"
version = "0.2.2"
description = "One ruleset for Claude Code, Codex, Copilot, Cursor, Windsurf, Gemini & Aider — token efficiency + spec-driven development in one CLI."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Keyur Patel", email = "keyurpatel446@gmail.com" }]
keywords = [
    "claude-code", "codex", "copilot", "cursor", "windsurf", "gemini", "aider",
    "tokens", "token-optimization", "llm", "cli", "ai-agents",
    "spec-driven-development", "prompt-engineering", "cost-optimization",
    "reduce-claude-tokens", "ai-coding", "developer-tools",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Intended Audience :: Developers",
]
# The core is intentionally dependency-free (stdlib only) for portable installs.
dependencies = []

[project.optional-dependencies]
# `pip install monolith-ai[bench]` enables exact token counts in `monolith
# bench`; without it the benchmark falls back to a heuristic counter.
bench = ["tiktoken>=0.5"]

[project.urls]
Homepage = "https://github.com/keyurpatel446/Monolith"
Changelog = "https://github.com/keyurpatel446/Monolith/blob/master/CHANGELOG.md"
Documentation = "https://github.com/keyurpatel446/Monolith/blob/master/docs/USAGE.md"
Roadmap = "https://github.com/keyurpatel446/Monolith/blob/master/ROADMAP.md"
"Bug Tracker" = "https://github.com/keyurpatel446/Monolith/issues"

[project.scripts]
monolith = "monolith.console:main"

[tool.hatch.build.targets.wheel]
packages = ["src/monolith"]
