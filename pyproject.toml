[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "monolith-ai"
version = "0.1.0"
description = "Cross-agent token-efficiency layer for AI coding assistants (Claude Code, OpenAI Codex, GitHub Copilot)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Keyur Patel", email = "keyurpatel446@gmail.com" }]
keywords = ["claude-code", "codex", "copilot", "tokens", "llm", "cli", "ai-agents"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
]
# Phase 1 is intentionally dependency-free (stdlib only) for portable installs.
dependencies = []

[project.urls]
Homepage = "https://github.com/keyurpatel446/monolith"
Roadmap = "https://github.com/keyurpatel446/monolith/blob/main/ROADMAP.md"

[project.scripts]
monolith = "monolith.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/monolith"]
